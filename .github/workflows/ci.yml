name: ci

on:
  push:
    branches: [main]
  pull_request:

# Through M4 we target Fedora only. See docs/adr/0002-fedora-primary-platform.md.
# Windows and macOS jobs return in M5.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: fedora:rawhide
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang-asan
            preset: linux-clang-asan
          - name: linux-gcc-rel
            preset: linux-gcc-rel

    steps:
      - uses: actions/checkout@v4

      - name: install required host development packages
        run: |
          dnf install -y \
            gcc gcc-c++ clang clang-tools-extra mold \
            cmake ninja-build sccache \
            git python3 pre-commit \
            autoconf autoconf-archive automake libtool perl perl-open \
            libX11-devel libXcursor-devel libXrandr-devel libXi-devel libXtst-devel \
            libXinerama-devel mesa-libGL-devel mesa-libEGL-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel \
            vulkan-loader-devel vulkan-tools \
            alsa-lib-devel pulseaudio-libs-devel \
            pkgconf-pkg-config curl tar zip unzip

      - name: install CI sanitizer and software-renderer extras
        run: |
          dnf install -y \
            llvm \
            mesa-vulkan-drivers

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: bootstrap host-native repo state
        run: |
          ./tools/dev bootstrap
          ./tools/dev bootstrap --check

      - name: configure
        env:
          VCPKG_BINARY_SOURCES: clear
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --output-junit junit.xml

      - name: slow renderer validation
        if: matrix.preset == 'linux-clang-asan'
        env:
          ENGINE_HEADLESS: "1"
          SDL_GPU_DRIVER: vulkan
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          test -s tests/sanitizers/lsan.supp
          export ASAN_SYMBOLIZER_PATH="$(command -v llvm-symbolizer)"
          export LSAN_OPTIONS="suppressions=$PWD/tests/sanitizers/lsan.supp:print_suppressions=1"
          ctest --test-dir build/linux-clang-asan \
            -C Debug \
            -L slow \
            --output-on-failure \
            --verbose
          ./build/linux-clang-asan/Debug/examples/clear_color/clear_color
          test -s build/test-output/clear_color_frame_5.ppm

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/junit.xml

      - name: upload renderer artifact
        if: matrix.preset == 'linux-clang-asan'
        uses: actions/upload-artifact@v4
        with:
          name: renderer-proof-${{ matrix.preset }}
          path: build/test-output/
          if-no-files-found: error
